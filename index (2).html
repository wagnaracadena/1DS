<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seja bem-vindo ao site de Documentos</title>

    <style>
        header {
            background-color: blue;
            color: white;
        }

        main {
            background-color: rgb(186, 85, 211);
            color: white;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
        }

        header {
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 0 0 10px 10px;
        }

        main {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            gap: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .artigo-autor {
            font-weight: bold;
            color: #555;
        }
    </style>
</head>

<body>

    <header>
        <h1>Documentos</h1>
    </header>

    <main>

        <!-- IMAGEM -->
        <img src="documentos.png"
            alt="Imagem relacionada a documentos">

        <div>

            <p>Registros de informação</p>

            <p class="artigo-autor">Por Wagnara</p>

            <h2>Meu primeiro post</h2>

            <p>
                Aqui vou compartilhar informações, registros
                e conteúdos importantes sobre documentos e organização.
            </p>

            <button>❤️ <span>0</span></button>

            <button>👍 <span>0</span></button>

        </div>

    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {

            botao.addEventListener("click", botaoClicado);

            function botaoClicado() {

                console.log("fui clicado");

                let texto = botao.querySelector("span");

                texto.textContent++;
            }
        });
    </script>

</body>

</html>
